# On commencer par fournir un nom
name: Compilation du projet atelier-test-unitaires
# On specifie a quel moment le workflow doit s exec
on:
  push:

jobs:
  compilation:
    runs-on: ubuntu-latest
    steps:
      - name : get code from source project
        uses : actions/checkout@v5
      - name : set up jdk25
        uses : actions/setup-java@v5
        with :
          java-version : '25'
          distribution : 'temurin'
      - name : add rights for compile
        run : chmod +x mvnw
      - name : compile le projet
        run : ./mvnw compile